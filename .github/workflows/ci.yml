name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m compileall -q __init__.py nodes.py studio.py still_decode.py scripts tests
      - name: Install CPU runtime for node tests
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install safetensors
      - name: Validate workflows and release artifacts
        run: python -m unittest discover -s tests -v
