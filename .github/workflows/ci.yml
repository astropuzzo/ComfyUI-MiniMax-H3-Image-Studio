name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m compileall -q __init__.py nodes.py scripts tests
      - name: Validate workflows and release artifacts
        run: python -m unittest discover -s tests -v
